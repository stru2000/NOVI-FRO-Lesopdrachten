<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Positioneren - Opdracht 2</title>
</head>
<body>
<article class="product">
    <!--    Plaats hier alle elementen-->

    <div class="product-container">
        <span class="product-new">New</span>
        <img src="assets/model-in-pink-blazer.jpg" alt="foto model" class="product-img">
        <img src="assets/favorite.svg" alt="favorite" class="product-img-favorite">
    </div>

    <div class="product-description">
        <p class="product-title">Conscious choice</p>
        <h3 class="product-description">Oversized single-breasted blazer</h3>
        <span class="color-dot1"></span>
        <span class="color-dot2"></span>
        <span class="color-dot3"></span>
        <span class="color-dot4"></span>
        <p class="product-price">€ 39,99</p>

    </div>
</article>
</body>
</html>
